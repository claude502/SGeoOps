services:
  geo-ops:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-postgresql://geo_ops:change-me-use-a-secret@postgres:5432/geo_content_ops?schema=public}
      - SGEO_ARTIFACT_ROOT=/var/lib/sgeo/artifacts
      - SGEO_SECRET_ROOT=/run/secrets
      - SGEO_INTERNAL_SECRET_FILE=/run/secrets/sgeo_internal_secret
    volumes:
      - artifact-data:/var/lib/sgeo/artifacts
      - ./secrets:/run/secrets:ro
    networks: [default, matomo-reporting]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-geo_content_ops}
      - POSTGRES_USER=${POSTGRES_USER:-geo_ops}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change-me-use-a-secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  trigger-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${TRIGGER_POSTGRES_DB:-trigger_dev}
      - POSTGRES_USER=${TRIGGER_POSTGRES_USER:-trigger_dev}
      - POSTGRES_PASSWORD=${TRIGGER_POSTGRES_PASSWORD:-change-me-trigger-secret}
    volumes:
      - trigger-postgres-data:/var/lib/postgresql/data

  trigger-dev:
    image: ghcr.io/triggerdotdev/trigger.dev:v4.5.9
    restart: unless-stopped
    depends_on:
      - trigger-postgres
      - redis
    ports:
      - "3040:3000"
    environment:
      - DATABASE_URL=${TRIGGER_DATABASE_URL:-postgresql://trigger_dev:change-me-trigger-secret@trigger-postgres:5432/trigger_dev?schema=public}
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=${TRIGGER_SECRET_KEY:-changeme-secret}
      - LOGIN_ORIGIN=http://localhost:3040
      - APP_ORIGIN=http://localhost:3040

  geo-worker:
    build:
      context: .
      dockerfile: geo-worker/Dockerfile
    command: ["npm", "run", "trigger:dev"]
    restart: unless-stopped
    depends_on:
      - trigger-dev
      - geo-ops
    environment:
      - TRIGGER_API_URL=http://trigger-dev:3000
      - TRIGGER_ACCESS_TOKEN=${TRIGGER_ACCESS_TOKEN:-}
      - TRIGGER_PROJECT_REF=proj_sgeo_ops
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY:-}
      - SGEO_INTERNAL_URL=http://geo-ops:3000
      - SGEO_INTERNAL_SECRET_FILE=/run/secrets/sgeo_internal_secret
      - SGEO_ARTIFACT_ROOT=/var/lib/sgeo/artifacts
      - SGEO_SECRET_ROOT=/run/secrets
    volumes:
      - artifact-data:/var/lib/sgeo/artifacts
      # Host secret directory/file: root:10001 0750 / root:10001 0640.
      - ./secrets:/run/secrets:ro
    networks: [default, matomo-reporting]

  matomo-db:
    image: mariadb:11.4.5
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MATOMO_DATABASE_NAME:-matomo}
      MARIADB_USER: ${MATOMO_DATABASE_USER:-matomo}
      MARIADB_PASSWORD: ${MATOMO_DATABASE_PASSWORD:?set MATOMO_DATABASE_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MATOMO_DATABASE_ROOT_PASSWORD:?set MATOMO_DATABASE_ROOT_PASSWORD}
    volumes: [matomo-db-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [matomo-private]

  matomo:
    image: matomo:5.12.0-apache
    restart: unless-stopped
    depends_on:
      matomo-db:
        condition: service_healthy
    environment:
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_DBNAME: ${MATOMO_DATABASE_NAME:-matomo}
      MATOMO_DATABASE_USERNAME: ${MATOMO_DATABASE_USER:-matomo}
      MATOMO_DATABASE_PASSWORD: ${MATOMO_DATABASE_PASSWORD:?set MATOMO_DATABASE_PASSWORD}
    volumes: [matomo-data:/var/www/html]
    expose: ["80"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "php -r '$$socket = @fsockopen(\"127.0.0.1\", 80); if (!$$socket) exit(1); fclose($$socket);'",
        ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [matomo-private, matomo-reporting]

  matomo-archive-cron:
    image: matomo:5.12.0-apache
    restart: unless-stopped
    depends_on:
      matomo:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        while true; do
          php /var/www/html/console core:archive --url=http://matomo
          date +%s > /tmp/matomo-archive-last-success
          sleep 3600
        done
    volumes: [matomo-data:/var/www/html]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -s /tmp/matomo-archive-last-success && now=$$(date +%s) && last=$$(cat /tmp/matomo-archive-last-success) && test $$((now - last)) -lt 5400",
        ]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 20m
    networks: [matomo-private]

networks:
  matomo-private:
    internal: true
  matomo-reporting:
    internal: true

volumes:
  postgres-data:
  redis-data:
  trigger-postgres-data:
  artifact-data:
  matomo-db-data:
  matomo-data:
