services:
  reverse-proxy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.example:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - geo-ops
    networks:
      - edge
      - app

  geo-ops:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      SGEO_ARTIFACT_ROOT: /var/lib/sgeo/artifacts
      SGEO_SECRET_ROOT: /run/secrets
      SGEO_INTERNAL_SECRET_FILE: /run/secrets/sgeo_internal_secret
    expose:
      - "3000"
    volumes:
      - artifact-data:/var/lib/sgeo/artifacts
      - ../secrets:/run/secrets:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app

  geo-worker:
    build:
      context: ..
      dockerfile: geo-worker/Dockerfile
    restart: unless-stopped
    environment:
      TRIGGER_API_URL: ${TRIGGER_API_URL:-}
      TRIGGER_ACCESS_TOKEN: ${TRIGGER_ACCESS_TOKEN:-}
      TRIGGER_PROJECT_REF: ${TRIGGER_PROJECT_REF:-proj_sgeo_ops}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      SGEO_INTERNAL_URL: http://geo-ops:3000
      SGEO_INTERNAL_SECRET_FILE: /run/secrets/sgeo_internal_secret
      SGEO_ARTIFACT_ROOT: /var/lib/sgeo/artifacts
      SGEO_SECRET_ROOT: /run/secrets
    volumes:
      - artifact-data:/var/lib/sgeo/artifacts
      - ../secrets:/run/secrets:ro
    depends_on:
      geo-ops:
        condition: service_healthy
    networks:
      - app

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geo_content_ops}
      POSTGRES_USER: ${POSTGRES_USER:-geo_ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  redis:
    image: redis:7-alpine
    profiles:
      - optional-cache
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - app

networks:
  edge:
  app:

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  artifact-data:
