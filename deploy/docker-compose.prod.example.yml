services:
  reverse-proxy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.example:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - geo-ops
    networks:
      - edge
      - app

  geo-ops:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      SGEO_ARTIFACT_ROOT: /var/lib/sgeo/artifacts
      SGEO_SECRET_ROOT: /run/secrets
      SGEO_INTERNAL_SECRET_FILE: /run/secrets/sgeo_internal_secret
    expose:
      - "3000"
    volumes:
      - artifact-data:/var/lib/sgeo/artifacts
      - ../secrets:/run/secrets:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app
      - matomo-reporting

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geo_content_ops}
      POSTGRES_USER: ${POSTGRES_USER:-geo_ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  redis:
    image: redis:7-alpine
    profiles:
      - optional-cache
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - app

  matomo-db:
    image: mariadb:11.4.5
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MATOMO_DATABASE_NAME:-matomo}
      MARIADB_USER: ${MATOMO_DATABASE_USER:-matomo}
      MARIADB_PASSWORD: ${MATOMO_DATABASE_PASSWORD:?set MATOMO_DATABASE_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MATOMO_DATABASE_ROOT_PASSWORD:?set MATOMO_DATABASE_ROOT_PASSWORD}
    volumes: [matomo-db-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [matomo-private]

  matomo:
    image: matomo:5.12.0-apache
    restart: unless-stopped
    depends_on:
      matomo-db:
        condition: service_healthy
    environment:
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_DBNAME: ${MATOMO_DATABASE_NAME:-matomo}
      MATOMO_DATABASE_USERNAME: ${MATOMO_DATABASE_USER:-matomo}
      MATOMO_DATABASE_PASSWORD: ${MATOMO_DATABASE_PASSWORD:?set MATOMO_DATABASE_PASSWORD}
    expose: ["80"]
    volumes: [matomo-data:/var/www/html]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "php -r '$$socket = @fsockopen(\"127.0.0.1\", 80); if (!$$socket) exit(1); fclose($$socket);'",
        ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [matomo-private, matomo-reporting]

  matomo-archive-cron:
    image: matomo:5.12.0-apache
    restart: unless-stopped
    depends_on:
      matomo:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        while true; do
          php /var/www/html/console core:archive --url=http://matomo
          date +%s > /tmp/matomo-archive-last-success
          sleep 3600
        done
    volumes: [matomo-data:/var/www/html]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -s /tmp/matomo-archive-last-success && now=$$(date +%s) && last=$$(cat /tmp/matomo-archive-last-success) && test $$((now - last)) -lt 5400",
        ]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 20m
    networks: [matomo-private]

networks:
  edge:
  app:
  matomo-private:
    internal: true
  matomo-reporting:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  artifact-data:
  matomo-db-data:
  matomo-data:
